version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use Node.js 18 explicitly (in case engines is ignored)
        - nvm install 18
        - nvm use 18
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
